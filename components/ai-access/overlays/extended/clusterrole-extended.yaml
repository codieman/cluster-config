# Free-form content that may contain credentials an application chose to log or
# store in a ConfigMap. Only enable this while you need it for troubleshooting.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-cluster-reader-extended
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-cluster-reader-extended
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-cluster-reader-extended
subjects:
- kind: ServiceAccount
  name: ai-cluster-reader
  namespace: ai-access
