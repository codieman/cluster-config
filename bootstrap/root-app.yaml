# App-of-apps root: deploys bootstrap/overlays/local.sno, which creates the
# cluster-config AppProject and one Application per component.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  project: cluster-config
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  source:
    path: bootstrap/overlays/local.sno
    repoURL: https://github.com/codieman/cluster-config.git
    targetRevision: main
  syncPolicy:
    automated:
      selfHeal: true
